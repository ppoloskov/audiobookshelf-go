services:
  monstrobook:
    image: ghcr.io/ppoloskov/monstrobook:latest
    # build: .
    container_name: monstrobook
    ports:
      - "13378:80"
    volumes:
      - ./config:/config
      - ./metadata:/metadata
      - ./audiobooks:/audiobooks
      - ./podcasts:/podcasts
    environment:
      - TZ=UTC
    restart: unless-stopped
