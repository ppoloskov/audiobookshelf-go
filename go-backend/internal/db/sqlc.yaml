version: "2"
sql:
  - engine: "sqlite"
    # sqlc cannot parse the pinned trigger bodies, and it rejects backtick
    # quoting. It reads the trigger-free, unquoted copy that `make sqlc`
    # derives from schema.sql (see the Makefile target).
    schema: "sqlc/schema.sql"
    queries: "queries/"
    gen:
      go:
        package: "sqlc"
        out: "sqlc"
        sql_package: "database/sql"
        emit_json_tags: false
        # Nullable columns are sql.Null* (read with .String/.Int64/.Valid);
        # pointers would need a deref helper at every read and &x at every write.
        emit_pointers_for_null_types: false
        overrides:
          # UUIDs are TEXT in the pinned schema.
          - db_type: "UUID"
            go_type: "string"
          - db_type: "UUID"
            nullable: true
            go_type: "database/sql.NullString"
          # DATETIME is read raw (time.Time, string or []byte, as the driver
          # returns it) and parsed by dbtime.OptionalMillis, as before. Writes
          # pass dbtime strings.
          - db_type: "DATETIME"
            go_type: { type: "any" }
          - db_type: "DATETIME"
            nullable: true
            go_type: { type: "any" }
          # JSON is TEXT. A []byte or json.RawMessage argument binds as a BLOB,
          # so JSON is read as NullString and written as a string.
          - db_type: "JSON"
            nullable: true
            go_type: "database/sql.NullString"
          - db_type: "JSON"
            go_type: "string"
          # Flags are TINYINT(1) 0/1.
          - db_type: "TINYINT(1)"
            nullable: true
            go_type: "database/sql.NullInt64"
          - db_type: "TINYINT(1)"
            go_type: "int64"
