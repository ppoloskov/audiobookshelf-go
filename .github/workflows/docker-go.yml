name: Build and Push Go Docker Image

# Builds ghcr.io/<owner>/audiobookshelf-go: the stock web client served by the
# Go server in go-backend/ (see Dockerfile.go). Pull requests build the image
# but never push it.

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CGO_ENABLED: '0'

jobs:
  # Runs Go unit/lint/cross-builds plus the live Twin-Server Differential Oracle
  # (pinned TS v2.37.2 vs Go across HTTP, 26 SQLite tables, Socket.IO, FS,
  # stubs, and bidirectional TS<->Go rollback).
  verify:
    name: Unified replacement verification
    uses: ./.github/workflows/go-backend.yml

  image:
    name: Build and push image
    needs: [verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/audiobookshelf-go
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=ref,event=pr

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.go
          build-args: |
            VCS_REF=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
