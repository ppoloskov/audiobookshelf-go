name: Unified replacement verification

on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-backend/go.mod
      - name: Fetch pinned upstream commit
        run: git fetch --no-tags --depth=1 origin edb1f7efc92ecacdef51aafb4d9d5054ce10604f
      - name: Install existing upstream dependencies and build retained client
        run: |
          npm ci
          npm ci --prefix client
          npm run generate --prefix client
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install the configured Go linter for the verifier
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          install-only: true
          working-directory: go-backend
      - name: Unified machine health, upstream proof and gated Go verification
        run: make VERIFY_NODE=node VERIFY_ARGS="-out $RUNNER_TEMP/replacement-verification/report.json" verify
      - name: Upload the single verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replacement-verification
          path: |
            ${{ runner.temp }}/replacement-verification
            /tmp/abs-verify-*
          if-no-files-found: error
