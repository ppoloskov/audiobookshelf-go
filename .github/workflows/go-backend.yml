name: Unified replacement verification

on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Go format, vet, unit tests, lint, and Linux cross-builds
        run: |
          nix develop --command bash -euo pipefail -c '
            test -z "$(gofmt -l .)"
            go vet ./...
            go vet -tags=oracle ./testmachine/oracle/...
            go test ./... -count=1
            CGO_ENABLED=1 go test -race ./testmachine/oracle/...
            golangci-lint run ./...
            GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/monstrobook
            GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/monstrobook
          '
      - name: Node coverage merger self-test
        run: |
          nix develop --command bash -euo pipefail -c '
            node --test testmachine/scripts/verify-coverage.test.mjs
          '
      - name: Fetch pinned upstream TS v2.37.2
        uses: actions/checkout@v4
        with:
          repository: advplyr/audiobookshelf
          ref: edb1f7efc92ecacdef51aafb4d9d5054ce10604f
          path: .oracle-upstream
      - name: Install upstream dependencies
        run: |
          nix develop --command bash -euo pipefail -c '
            npm ci --prefix .oracle-upstream
          '
      - name: Twin-Server Differential Oracle (TS v2.37.2 vs Go + bidirectional rollback)
        run: |
          nix develop --command bash -euo pipefail -c '
            make ORACLE_NODE_CMD=node ORACLE_ARGS="--min-v8-pct 75 --min-route-pct 95" verify
          '
      - name: Upload oracle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-verification
          path: /tmp/abs-oracle-run-*
          if-no-files-found: warn
