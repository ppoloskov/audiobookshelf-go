version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
  settings:
    errcheck:
      # Deferred cleanup of read-only handles and best-effort removal of temp
      # files; a failure here has nothing to recover. Closes of anything that
      # was written to (files, zip writers) are checked in code.
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (*archive/zip.ReadCloser).Close
        - (io/fs.File).Close
        - (mime/multipart.File).Close
        - (*net/smtp.Client).Close
        - (*github.com/fsnotify/fsnotify.Watcher).Close
        - (*database/sql.Rows).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*audiobookshelf-compat/internal/db.DB).Close
        # WebSocket client connections in tests.
        - (*golang.org/x/net/websocket.Conn).Close
        - os.Remove
        - os.RemoveAll
        # Output to stderr, SMTP DATA writers and test recorders; write
        # errors surface on the next write or on close.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    staticcheck:
      checks:
        # golangci-lint's default set, spelled out so the exclusions below read clearly.
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Error strings are client-visible messages and must not change.
        - -ST1005
        # Pure-style quick fixes.
        - -QF1001
        - -QF1008
