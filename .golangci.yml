version: "2"

# Layers (an import may only point down):
#   leaf        stdlib (and logging) only: no other internal package
#   foundation  store, settings, access and shared builders: leaves and each other, never a feature
#   feature     one HTTP feature each: leaves and foundation, never another feature or server
#   server      composition root: imports everything
linters:
  default: none
  enable:
    - depguard
  settings:
    depguard:
      rules:
        wire-no-internal:
          list-mode: lax
          files:
            - "**/internal/wire/*.go"
            - "**/internal/wire/**/*.go"
          deny:
            - pkg: audiobookshelf-compat/internal
        leaf-boundaries:
          list-mode: strict
          files:
            - '!**/*_test.go'
            - "**/internal/httputil/*.go"
            - "**/internal/httputil/**/*.go"
            - "**/internal/dbtime/*.go"
            - "**/internal/dbtime/**/*.go"
            - "**/internal/events/*.go"
            - "**/internal/events/**/*.go"
            - "**/internal/ids/*.go"
            - "**/internal/ids/**/*.go"
            - "**/internal/deviceinfo/*.go"
            - "**/internal/deviceinfo/**/*.go"
            - "**/internal/logging/*.go"
            - "**/internal/logging/**/*.go"
            - "**/internal/version/*.go"
            - "**/internal/version/**/*.go"
            - "**/internal/config/*.go"
            - "**/internal/config/**/*.go"
            - "**/internal/cronspec/*.go"
            - "**/internal/cronspec/**/*.go"
            - "**/internal/filekind/*.go"
            - "**/internal/filekind/**/*.go"
            - "**/internal/jsonvalue/*.go"
            - "**/internal/jsonvalue/**/*.go"
            - "**/internal/nameparse/*.go"
            - "**/internal/nameparse/**/*.go"
            - "**/internal/textclean/*.go"
            - "**/internal/textclean/**/*.go"
            - "**/internal/textdist/*.go"
            - "**/internal/textdist/**/*.go"
            - "**/internal/mediatools/*.go"
            - "**/internal/mediatools/**/*.go"
          allow:
            - $gostd
            - audiobookshelf-compat/internal/logging
            # cronspec and textclean wrap one third-party parser each.
            - github.com/robfig/cron/v3
            - golang.org/x/net/html
        textsort-leaf-dependency:
          list-mode: strict
          files:
            - '!**/*_test.go'
            - "**/internal/textsort/*.go"
            - "**/internal/textsort/**/*.go"
          allow:
            - $gostd
            - golang.org/x/text/collate
            - golang.org/x/text/language
        auth-leaf-dependency:
          list-mode: strict
          files:
            - '!**/*_test.go'
            - "**/internal/auth/*.go"
            - "**/internal/auth/**/*.go"
          allow:
            - $gostd
            - golang.org/x/net/html
            - github.com/golang-jwt/jwt/v5
            # ids is itself a stdlib-only leaf (token jti generation).
            - audiobookshelf-compat/internal/ids
        production-httptest:
          list-mode: lax
          files:
            - '!**/*_test.go'
          deny:
            - pkg: net/http/httptest$
        foundation-no-features:
          list-mode: lax
          files:
            - '!**/*_test.go'
            - "**/internal/store/*.go"
            - "**/internal/store/**/*.go"
            - "**/internal/serversettings/*.go"
            - "**/internal/serversettings/**/*.go"
            - "**/internal/settingsdoc/*.go"
            - "**/internal/settingsdoc/**/*.go"
            - "**/internal/access/*.go"
            - "**/internal/access/**/*.go"
            - "**/internal/libitem/*.go"
            - "**/internal/libitem/**/*.go"
            - "**/internal/users/*.go"
            - "**/internal/users/**/*.go"
            - "**/internal/progressdto/*.go"
            - "**/internal/progressdto/**/*.go"
            - "**/internal/filterdata/*.go"
            - "**/internal/filterdata/**/*.go"
            - "**/internal/itemwrite/*.go"
            - "**/internal/itemwrite/**/*.go"
          deny:
            - pkg: audiobookshelf-compat/internal/catalog$
            - pkg: audiobookshelf-compat/internal/userapi$
            - pkg: audiobookshelf-compat/internal/identity$
            - pkg: audiobookshelf-compat/internal/playback$
            - pkg: audiobookshelf-compat/internal/scanner$
            - pkg: audiobookshelf-compat/internal/podcasts$
            - pkg: audiobookshelf-compat/internal/providers$
            - pkg: audiobookshelf-compat/internal/sharing$
            - pkg: audiobookshelf-compat/internal/adminops$
            - pkg: audiobookshelf-compat/internal/notifications$
            - pkg: audiobookshelf-compat/internal/emailapi$
            - pkg: audiobookshelf-compat/internal/backup$
            - pkg: audiobookshelf-compat/internal/audiotools$
            - pkg: audiobookshelf-compat/internal/realtime$
            - pkg: audiobookshelf-compat/internal/lists$
            - pkg: audiobookshelf-compat/internal/server$
        feature-cross-imports:
          list-mode: lax
          files:
            - '!**/*_test.go'
            - "**/internal/catalog/*.go"
            - "**/internal/catalog/**/*.go"
            - "**/internal/userapi/*.go"
            - "**/internal/userapi/**/*.go"
            - "**/internal/identity/*.go"
            - "**/internal/identity/**/*.go"
            - "**/internal/playback/*.go"
            - "**/internal/playback/**/*.go"
            - "**/internal/scanner/*.go"
            - "**/internal/scanner/**/*.go"
            - "**/internal/podcasts/*.go"
            - "**/internal/podcasts/**/*.go"
            - "**/internal/providers/*.go"
            - "**/internal/providers/**/*.go"
            - "**/internal/sharing/*.go"
            - "**/internal/sharing/**/*.go"
            - "**/internal/adminops/*.go"
            - "**/internal/adminops/**/*.go"
            - "**/internal/notifications/*.go"
            - "**/internal/notifications/**/*.go"
            - "**/internal/emailapi/*.go"
            - "**/internal/emailapi/**/*.go"
            - "**/internal/backup/*.go"
            - "**/internal/backup/**/*.go"
            - "**/internal/audiotools/*.go"
            - "**/internal/audiotools/**/*.go"
            - "**/internal/realtime/*.go"
            - "**/internal/realtime/**/*.go"
            - "**/internal/lists/*.go"
            - "**/internal/lists/**/*.go"
          deny:
            - pkg: audiobookshelf-compat/internal/catalog$
            - pkg: audiobookshelf-compat/internal/userapi$
            - pkg: audiobookshelf-compat/internal/identity$
            - pkg: audiobookshelf-compat/internal/playback$
            - pkg: audiobookshelf-compat/internal/scanner$
            - pkg: audiobookshelf-compat/internal/podcasts$
            - pkg: audiobookshelf-compat/internal/providers$
            - pkg: audiobookshelf-compat/internal/sharing$
            - pkg: audiobookshelf-compat/internal/adminops$
            - pkg: audiobookshelf-compat/internal/notifications$
            - pkg: audiobookshelf-compat/internal/emailapi$
            - pkg: audiobookshelf-compat/internal/backup$
            - pkg: audiobookshelf-compat/internal/audiotools$
            - pkg: audiobookshelf-compat/internal/realtime$
            - pkg: audiobookshelf-compat/internal/lists$
            - pkg: audiobookshelf-compat/internal/server$
